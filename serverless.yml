service: prostore-back

useDotenv: true

frameworkVersion: '3'

plugins:
  - serverless-offline

provider:
  name: aws
  runtime: nodejs18.x
  region: ${env:AWS_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    JWT_SECRET: ${env:JWT_SECRET, 'default-secret-change-in-prod'}
    JWT_EXPIRES_IN: ${env:JWT_EXPIRES_IN, '24h'}
    AWS_S3_BUCKET: ${env:AWS_S3_BUCKET, 'gnfls'}
    AWS_S3_REGION: ${env:AWS_S3_REGION, 'us-east-2'}
    S3_ACCESS_KEY_ID: ${env:AWS_ACCESS_KEY_ID, ''}
    S3_SECRET_ACCESS_KEY: ${env:AWS_SECRET_ACCESS_KEY, ''}
    RECEIPTS_BUCKET: ${env:RECEIPTS_BUCKET, 'envitienda-comprobantes-567764214813'}
    RECEIPTS_REGION: ${env:RECEIPTS_REGION, 'us-east-2'}
    RECEIPT_COMPANY_NAME: ${env:RECEIPT_COMPANY_NAME, 'Envi Tienda'}
    RECEIPT_COMPANY_NIT: ${env:RECEIPT_COMPANY_NIT, ''}
    MAIL_HOST: ${env:MAIL_HOST, 'smtp.gmail.com'}
    MAIL_PORT: ${env:MAIL_PORT, '587'}
    MAIL_USER: ${env:MAIL_USER, 'admin@envitienda.com'}
    MAIL_PASS: ${env:MAIL_PASS, ''}
    MAIL_FROM: ${env:MAIL_FROM, 'ENVI <admin@envitienda.com>'}
    STORE_URL: ${env:STORE_URL, 'https://envitienda.com'}
    SUPPORT_EMAIL: ${env:SUPPORT_EMAIL, 'admin@envitienda.com'}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:Scan
      Resource: "arn:aws:dynamodb:${aws:region}:*:table/*"
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
      Resource: "arn:aws:s3:::${env:AWS_S3_BUCKET, 'gnfls'}/*"
    - Effect: Allow
      Action:
        - s3:PutObject
        - s3:GetObject
      Resource: "arn:aws:s3:::envitienda-comprobantes-567764214813/*"

functions:
  # ═══════════════════════════════════════════════════════════
  # AUTENTICACIÓN
  # ═══════════════════════════════════════════════════════════

  register:
    handler: lambdas/auth/register.handler
    events:
      - http:
          path: auth/register
          method: post
          cors: true

  login:
    handler: lambdas/auth/login.handler
    events:
      - http:
          path: auth/login
          method: post
          cors: true

  # ═══════════════════════════════════════════════════════════
  # USUARIOS
  # ═══════════════════════════════════════════════════════════

  userCreate:
    handler: lambdas/users/createUser.handler
    events:
      - http:
          path: users
          method: post
          cors: true

  userGetAll:
    handler: lambdas/users/getAllUsers.handler
    events:
      - http:
          path: users
          method: get
          cors: true

  userGetOne:
    handler: lambdas/users/getUser.handler
    events:
      - http:
          path: users/{userId}
          method: get
          cors: true

  userUpdate:
    handler: lambdas/users/updateUser.handler
    events:
      - http:
          path: users/{userId}
          method: put
          cors: true

  userDelete:
    handler: lambdas/users/deleteUser.handler
    events:
      - http:
          path: users/{userId}
          method: delete
          cors: true

  # ═══════════════════════════════════════════════════════════
  # ROLES
  # ═══════════════════════════════════════════════════════════

  roleCreate:
    handler: lambdas/roles/createRole.handler
