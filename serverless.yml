          cors: true

  roleGetAll:
    handler: lambdas/roles/getAllRoles.handler
    events:
      - http:
          path: roles
          method: get
          cors: true

  roleGetOne:
    handler: lambdas/roles/getRole.handler
    events:
      - http:
          path: roles/{roleId}
          method: get
          cors: true

  roleUpdate:
    handler: lambdas/roles/updateRole.handler
    events:
      - http:
          path: roles/{roleId}
          method: put
          cors: true

  roleDelete:
    handler: lambdas/roles/deleteRole.handler
    events:
      - http:
          path: roles/{roleId}
          method: delete
          cors: true

  # ═══════════════════════════════════════════════════════════
  # CATEGORIES
  # ═══════════════════════════════════════════════════════════

  categoryCreate:
    handler: lambdas/categories/createCategory.handler
    events:
