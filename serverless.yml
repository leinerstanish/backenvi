    events:
      - http:
          path: withdrawals/{withdrawalId}
          method: get
          cors: true

  withdrawalUpdate:
    handler: lambdas/withdrawals/updateWithdrawal.handler
    events:
      - http:
          path: withdrawals/{withdrawalId}
          method: put
          cors: true

  withdrawalDelete:
    handler: lambdas/withdrawals/deleteWithdrawal.handler
    events:
      - http:
          path: withdrawals/{withdrawalId}
          method: delete
          cors: true

  # ═══════════════════════════════════════════════════════════
  # REVIEWS (RESEÑAS POR LÍNEA ENTREGADA)
  # ═══════════════════════════════════════════════════════════

  reviewLink:
    handler: lambdas/reviews/getReviewLink.handler
    events:
      - http:
          path: reviews/link/{token}
          method: get
          cors: true

  reviewCreate:
    handler: lambdas/reviews/createReview.handler
    events:
      - http:
          path: reviews
          method: post
          cors: true

  reviewList:
    handler: lambdas/reviews/listReviews.handler
